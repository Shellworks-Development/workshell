# Publishes a GitHub Release when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# Assets: the workshell binary for Linux, macOS and Windows (amd64 and arm64),
# the SDK as Workshell.rbxm, and SHA256SUMS (install.sh checks against it).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build the dashboard
        run: make web
      - name: Test
        run: go test ./...
      - name: Build release archives
        run: make dist VERSION=${{ github.ref_name }}
      - name: Build the SDK model
        run: |
          curl -fsSL -o "$RUNNER_TEMP/rojo.zip" https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          unzip -q "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/rojo"
          "$RUNNER_TEMP/rojo/rojo" build sdk/default.project.json -o dist/Workshell.rbxm
          cd dist && sha256sum workshell_* Workshell.rbxm > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Workshell $GITHUB_REF_NAME" --generate-notes --verify-tag
